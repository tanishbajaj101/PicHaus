services:
  gooncave:
    build: .
    env_file: .env
    ports:
      - "3000:3000"
    depends_on:
      - db
      - machine-learning
    volumes:
      - gooncave-storage:/app/storage

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gooncave
      POSTGRES_PASSWORD: gooncave
      POSTGRES_DB: gooncave
    volumes:
      - gooncave-db:/var/lib/postgresql/data

  # Face detection is optional. This service can be removed when
  # FACE_DETECTION_ENABLED=false in .env.
  machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:release
    environment:
      MACHINE_LEARNING_CACHE_FOLDER: /cache
    volumes:
      - gooncave-ml-cache:/cache

volumes:
  gooncave-storage:
  gooncave-db:
  gooncave-ml-cache:
